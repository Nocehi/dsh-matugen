name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - run: npm install --ignore-scripts
      - run: npm run check
      - name: Emit lockfile for audit-hardening bootstrap
        run: node -e "const fs=require('node:fs'); process.stdout.write('LOCKFILE_BASE64='+fs.readFileSync('package-lock.json').toString('base64')+'\\n')"

  rc6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - run: npm install --ignore-scripts --no-save --package-lock=false --omit=dev @deepseek-ai/dsh@0.1.0-rc.6
      - run: npm run test:rc6
